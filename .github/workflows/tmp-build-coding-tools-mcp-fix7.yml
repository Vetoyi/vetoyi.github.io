name: Temporary Coding Tools MCP Fix7 Relay Build

on:
  push:
    branches:
      - tmp-build-coding-tools-mcp-relay-fix7

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout temporary build helpers
        uses: actions/checkout@v4

      - name: Prepare pinned v0.2.0 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/mybolide/coding-tools-mcp/archive/4384593b85b66ba5b5f229e19657780c6f6386f6.zip' -OutFile source.zip
          Expand-Archive source.zip -DestinationPath src
          $dir = Get-ChildItem src -Directory | Select-Object -First 1
          Move-Item $dir.FullName app

      - name: Apply validated fix2 base
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/Vetoyi/vetoyi.github.io/10722ad45c61848b41ff5dcb9f3f2e6247a2e567/tmp-build/fix2_apply.py' -OutFile fix2_apply.py
          python fix2_apply.py

      - name: Apply validated fix3 deltas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/Vetoyi/vetoyi.github.io/6702bcfd0a75c3a33468629de52b72d806eb9866/tmp-build/fix3_delta.py' -OutFile fix3_delta.py
          python fix3_delta.py

      - name: Apply validated fix4 local OpenAPI delta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/Vetoyi/vetoyi.github.io/5c3124e240ac0846175311e54e4c91ad2cee4496/tmp-build/fix4_delta.py' -OutFile fix4_delta.py
          python fix4_delta.py

      - name: Apply validated fix5 registered-connection gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/Vetoyi/vetoyi.github.io/af26b5eab9c842be8415f7910faa3fc05cc32cc1/tmp-build/fix5_delta.py' -OutFile fix5_delta.py
          python fix5_delta.py

      - name: Apply validated fix6 lifecycle and diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'tmp-build/fix6_delta.py'
          $text = [IO.File]::ReadAllText($path)
          $text = $text.Replace('src/routes/workspaces/[id]/+page.svelte','src/routes/workspace/[id]/+page.svelte')
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          python tmp-build/fix6_delta.py
          python tmp-build/fix6_cleanup.py

      - name: Assemble and apply fix7 relay patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $content = ''
          1..7 | ForEach-Object {
            $part = ('tmp-build/relay_fix7.part{0:D2}' -f $_)
            if (-not (Test-Path $part)) { throw "missing patch part: $part" }
            $content += [IO.File]::ReadAllText($part)
          }
          [IO.File]::WriteAllText('relay_fix7.patch', $content, [Text.UTF8Encoding]::new($false))
          Push-Location app
          git init | Out-Null
          git apply --check --ignore-space-change --ignore-whitespace ../relay_fix7.patch
          git apply --ignore-space-change --ignore-whitespace ../relay_fix7.patch
          Pop-Location

      - name: Install fix7 new source files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'app/src-tauri/src/relay' | Out-Null
          New-Item -ItemType Directory -Force 'app/src-tauri/src/commands' | Out-Null
          New-Item -ItemType Directory -Force 'app/src/lib/api' | Out-Null
          New-Item -ItemType Directory -Force 'app/src/lib/components' | Out-Null
          Copy-Item 'tmp-build/fix7-new/src-tauri/src/commands/relay.rs' 'app/src-tauri/src/commands/relay.rs' -Force
          Copy-Item 'tmp-build/fix7-new/src-tauri/src/relay/worker.mjs' 'app/src-tauri/src/relay/worker.mjs' -Force
          Copy-Item 'tmp-build/fix7-new/src/lib/api/relay.ts' 'app/src/lib/api/relay.ts' -Force
          Copy-Item 'tmp-build/fix7-new/src/lib/components/RelayConfigPanel.svelte' 'app/src/lib/components/RelayConfigPanel.svelte' -Force
          $relayMod = ''
          1..3 | ForEach-Object {
            $relayMod += [IO.File]::ReadAllText(('tmp-build/fix7-new/src-tauri/src/relay/mod.part{0:D2}' -f $_))
          }
          [IO.File]::WriteAllText('app/src-tauri/src/relay/mod.rs', $relayMod, [Text.UTF8Encoding]::new($false))

      - name: Apply final fix7 security hardening
        run: python tmp-build/fix7_hardening.py

      - name: Verify no personal deployment data is embedded
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patterns = @('Vetoyi', '76245184', 'ban-raw-craps-tractor.trycloudflare.com')
          foreach ($pattern in $patterns) {
            $matches = Get-ChildItem app/src-tauri/src/relay,app/src-tauri/src/commands/relay.rs,app/src/lib/api/relay.ts,app/src/lib/components/RelayConfigPanel.svelte -Recurse -File |
              Select-String -SimpleMatch $pattern
            if ($matches) { throw "personal deployment data found: $pattern" }
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Worker JavaScript syntax check
        run: node --check app/src-tauri/src/relay/worker.mjs

      - name: Worker offline/security smoke test
        shell: pwsh
        run: |
          @'
          import relay from './app/src-tauri/src/relay/worker.mjs';

          const json = (value, status = 200) => new Response(JSON.stringify(value), {
            status,
            headers: { 'content-type': 'application/json' },
          });
          const stub = { fetch: async (request) => {
            const url = new URL(request.url);
            if (url.pathname === '/resolve') return json({ online: false });
            if (url.pathname === '/update') return json({ ok: true });
            return new Response(null, { status: 404 });
          }};
          const baseEnv = {
            SERVICE_KIND: 'actions',
            RELAY_STATE: { idFromName: () => 'singleton', get: () => stub },
            ADMIN_PUBLIC_KEY_B64: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA',
            ORIGIN_AUTH_TOKEN: 'origin-secret',
          };

          let response = await relay.fetch(new Request('https://relay.invalid/actions/test_tool', {
            method: 'POST', body: '{}', headers: { 'content-type': 'application/json' },
          }), baseEnv);
          if (response.status !== 503) throw new Error(`allowed Actions path expected 503 offline, got ${response.status}`);

          response = await relay.fetch(new Request('https://relay.invalid/actions/foo/bar', { method: 'POST', body: '{}' }), baseEnv);
          if (response.status !== 404) throw new Error(`nested Actions path must be 404, got ${response.status}`);

          response = await relay.fetch(new Request('https://relay.invalid/__ctm/health'), baseEnv);
          const healthText = await response.text();
          if (response.status !== 200 || healthText.includes('trycloudflare.com') || healthText.includes('target')) {
            throw new Error(`public health leaked backend details: ${healthText}`);
          }

          const invalidTarget = {
            service: 'actions', target: 'http://127.0.0.1', offline: false,
            generation: 1, timestamp_ms: Date.now(), lease_seconds: 300,
            nonce: '0123456789abcdef',
          };
          response = await relay.fetch(new Request('https://relay.invalid/__ctm/update', {
            method: 'POST', body: JSON.stringify(invalidTarget), headers: { 'content-type': 'application/json' },
          }), baseEnv);
          if (response.status !== 400) throw new Error(`SSRF target must be rejected before signature check, got ${response.status}`);

          const unsigned = { ...invalidTarget, target: 'https://valid-name.trycloudflare.com', generation: 2 };
          response = await relay.fetch(new Request('https://relay.invalid/__ctm/update', {
            method: 'POST', body: JSON.stringify(unsigned), headers: { 'content-type': 'application/json' },
          }), baseEnv);
          if (response.status !== 403) throw new Error(`unsigned valid target update must be 403, got ${response.status}`);

          console.log('worker security smoke tests passed');
          '@ | Set-Content -Encoding utf8 worker-smoke.mjs
          node worker-smoke.mjs

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Frontend check
        working-directory: app
        run: npm run check

      - name: Relay targeted Rust tests
        working-directory: app/src-tauri
        run: |
          cargo test target_validation_only_accepts_quick_tunnel_root
          cargo test worker_names_are_generic_and_deterministic
          cargo test canonical_signature_payload_is_stable
          cargo test origin_guard_allows_direct_localhost_but_rejects_spoofed_proxy_localhost
          cargo test relay_is_canonical_but_quick_url_remains_transport
          cargo test relay_never_overrides_named_or_non_cloudflare_tunnel

      - name: Existing MCP OAuth regression tests
        working-directory: app/src-tauri
        run: |
          cargo test external_base_url_uses_current_host_for_stale_quick_tunnel
          cargo test stale_quick_tunnel_does_not_trust_non_cloudflare_host

      - name: Existing Actions request-origin regression tests
        working-directory: app/src-tauri
        run: |
          cargo test openapi_server_is_rewritten_to_current_request_origin
          cargo test openapi_base_uses_local_request_origin_for_localhost
          cargo test openapi_base_uses_current_public_request_origin

      - name: Existing Quick Tunnel readiness and rate-limit tests
        working-directory: app/src-tauri
        run: |
          cargo test quick_tunnel_url_alone_is_not_ready
          cargo test quick_tunnel_becomes_ready_after_registered_connection
          cargo test detects_cloudflare_1015_rate_limit_line
          cargo test detects_plain_429_rate_limit_line

      - name: Existing health checker regression tests
        working-directory: app/src-tauri
        run: |
          cargo test normalizes_trailing_slash_for_oauth_origin_checks
          cargo test identifies_quick_tunnel_urls
          cargo test only_network_errors_are_downgraded_to_warning
          cargo test openapi_server_must_match_current_origin
          cargo test quick_cloudflare_is_detected_for_health_state
          cargo test stopped_tunnel_message_mentions_rate_limit_when_cooling_down

      - name: Full Rust tests except known Windows runner cold-start flake
        working-directory: app/src-tauri
        run: cargo test -- --skip windows_workspace_scripts_and_python_unicode_execute_successfully

      - name: Unrelated Windows execution smoke test
        continue-on-error: true
        working-directory: app/src-tauri
        run: cargo test windows_workspace_scripts_and_python_unicode_execute_successfully

      - name: Build Windows NSIS installer
        working-directory: app
        run: npm run tauri -- build --bundles nsis

      - name: Rename installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'app/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'NSIS installer not found' }
          Copy-Item $exe.FullName 'Coding.Tools.MCP_0.2.0fix7_x64-setup.exe'
          Get-FileHash 'Coding.Tools.MCP_0.2.0fix7_x64-setup.exe' -Algorithm SHA256 | Format-List

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Coding.Tools.MCP_0.2.0fix7_x64-setup
          path: Coding.Tools.MCP_0.2.0fix7_x64-setup.exe
          if-no-files-found: error
